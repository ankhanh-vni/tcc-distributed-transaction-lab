name: Verify TCC protocol
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker
        run: docker info && docker compose version
      - name: Package fresh service jars
        run: mvn -B -DskipTests package
      - name: Run all unit, PostgreSQL and Compose tests
        run: mvn -B test
      - name: Require executed integration suites
        run: python3 scripts/check-test-reports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/*'
